[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true

select = ["E", "F", "I", "B", "UP", "A", "W"]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standar"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

[project]
name = "tamp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "matplotlib",
]
